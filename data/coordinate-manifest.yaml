# ============================================================
# Veydria Coordinate Manifest — Spatial Feature Positions
# ============================================================
# This file is the single source of truth for all feature
# coordinates used in map generation. It is derived from
# veydria-schematic.svg (1200x800 viewBox).
#
# EDITING: Coordinates can be adjusted via the web map's
# edit mode (drag markers). Use the "Export Patch" button
# to generate a YAML patch, then apply it with:
#   python -m generator.tools.apply_patch <patch.yaml>
# ============================================================

coordinate_system:
  type: svg_viewbox
  width: 1200
  height: 800
  description: "All coordinates in SVG viewBox space. The web frontend inverts Y for Leaflet CRS.Simple."
