# ============================================================
# asterisms.yaml — the chart's navigational asterism register (art-layer extract)
# ============================================================
#
# Machine-readable projection of the Oravan nakhoda star-register for the
# cartography ocean-chart marginalia. Source of truth is worldbuilder canon:
#   worldbuilder/religion/01_traditions/star-register.md  (status: canonical, 2026-06-06)
# authored under ADR-0023 (ocean marginalia is an art layer over a names-only canon;
# "astrology creatures" resolve to navigational asterisms, NOT a bestiary).
#
# This file is the CARTOGRAPHY-SIDE extract that ADR-0023 Q6/Q7 assign to this repo
# ("authoring that YAML and its loader is a cartography-side follow-on"). It asserts
# NO new attested fact — every id, label, gloss, and etymology is read straight from
# the register; no new morphemes are minted (see the register's attestation rule).
#
# Source-of-truth direction is .md (worldbuilder) -> .yaml (here) -> .json (generated).
# Build: `npm run build:asterisms` (web/) converts this to web/public/asterisms.json,
# which the app fetches at runtime. The per-figure `id` is the stable identifier,
# minted under the register's canonical id (religion.tradition.star_register) because
# the register names the figures as sections, not as separate entities.
#
# Contract: worldbuilder/design/world-architecture/ADR-0023-cartographic-marginalia-and-asterism-register.md

schema_version: 1

controlled_vocabularies:
  # A star-figure from the register (asterism), an abstract name-plate device
  # (cartouche, ADR-0023 restricted-C), or a real ocean-fauna "here be…" engraving
  # (fauna, ADR-0023 layer B). All three are art over a names-only canon.
  kind: [asterism, cartouche, fauna]
  # Where the marginalia sits on the chart: the sky/margin band, or in open water
  # (the real-fauna engraving layer, ADR-0023 layer B). Stars are `sky`; fauna are
  # `open_water`.
  placement: [sky, open_water]
  # For stars/cartouche this is the governing register (Oravan nakhoda chart-speech,
  # ADR-0023 Q5). For fauna it doubles as the HOME-REGION key (the culture whose
  # attested ecology names the creature) → drives region-aware placement. Both are
  # attested cultures (worldbuilder ecology/{regions,encounters}/<civ>.md).
  civ: [oravan, aethelian]

# Entries: the six named star-figures (in register order), one abstract cartouche
# device, then the layer-B ocean-fauna engravings. illustration_ref is null on every
# row — the art is inline SVG authored in TS (the picture is non-canon, ADR-0023 Q2).
asterisms:
  - id: religion.tradition.star_register.serakar
    civ: oravan
    kind: asterism
    placement: sky
    prose_label: "Serakar — the Crown Star"
    gloss: "The fixed pole; holds latitude and heading, shot with the kamal. The star that does not move."
    etymology: "sera (star, navigation mark) + kar (crown, peak)"
    illustration_ref: null

  - id: religion.tradition.star_register.vanasera
    civ: oravan
    kind: asterism
    placement: sky
    prose_label: "Vanasera — the Landfall Star"
    gloss: "A bright southern star whose low altitude over the palm line marks approach to an island's latitude."
    etymology: "vana (mouth, bay, inlet — landfall) + sera (star)"
    illustration_ref: null

  - id: religion.tradition.star_register.murasera
    civ: oravan
    kind: asterism
    placement: sky
    prose_label: "Murasera — the Storm-Star"
    gloss: "Its dawn rising marks the monsoon shoulder — the season to haul the jong out and stop voyaging."
    etymology: "mura (storm, destruction) + sera (star)"
    illustration_ref: null

  - id: religion.tradition.star_register.measera
    civ: oravan
    kind: asterism
    placement: sky
    prose_label: "Measera — the Dawn-Star"
    gloss: "The bright morning star that opens the sailing day and times the change of watch on a night crossing."
    etymology: "mea (red, sunrise) + sera (star)"
    illustration_ref: null

  - id: religion.tradition.star_register.serama
    civ: oravan
    kind: asterism
    placement: sky
    prose_label: "Serama — the Star-River"
    gloss: "The luminous band of the night sky, steered along as a heading-line on moonless, star-clear nights."
    etymology: "sera (star) + ma (great, vast)"
    illustration_ref: null

  - id: religion.tradition.star_register.seraili
    civ: oravan
    kind: asterism
    placement: sky
    prose_label: "Seraili — the Remembered Stars"
    gloss: "Foreign fixed-points the Qollari name as ancestors; the nakhoda borrows their positions to time corridor access, not their genealogy."
    etymology: "sera (star) + ili (memory, history)"
    illustration_ref: null

  # One abstract cartouche device (kind: cartouche, ADR-0023 restricted-C) — the
  # attested nakhoda chart-oath sworn on Serakar, the pole star. A name-plate only:
  # it NAMES the watched pole, it does not DRAW the Sky Witness (no deity face/POV,
  # deity rails 00_taxonomy.md). NOT a 7th register figure — id suffixed `_oath`.
  - id: religion.tradition.star_register.serakar_oath
    civ: oravan
    kind: cartouche
    placement: sky
    prose_label: "By the star that watches"
    gloss: "Nakhoda chart-oath sworn on Serakar, the star that does not move; a name-plate device, not a figure."
    etymology: "pidgin oath attested in the sky-mandate; bound to sera + kar (the Crown Star)"
    illustration_ref: null

  # ── Layer B: real ocean-fauna "here be…" engravings (ADR-0023, attested-only) ──
  # Antique sea-chart creatures drawn in open water near their home region. The
  # "no invented creatures" rail holds: every species is real and already attested
  # in worldbuilder ecology (regions/encounters tables) and/or the synced
  # encounters.json. The picture is non-canon art (ADR-0023 Q2); ids are minted
  # under ecology.fauna.<civ>.<slug> and assert NO new fact. Un-named species carry
  # a descriptive label (no minted canon name); canon-named species use that name.
  # civ = the home region whose waters these are (drives region-aware placement).

  - id: ecology.fauna.oravan.sea_snake
    civ: oravan
    kind: fauna
    placement: open_water
    prose_label: "the sea-serpent"
    gloss: "Hydrophis spp. — banded sea snakes of the archipelago shoals."
    etymology: "real-world species; attested ecology/encounters/oravan.md (oravan.sea_snake)."
    illustration_ref: null

  - id: ecology.fauna.oravan.saltwater_crocodile
    civ: oravan
    kind: fauna
    placement: open_water
    prose_label: "the storm-crocodile"
    gloss: "Crocodylus porosus — the saltwater crocodile of the monsoon deltas and coasts."
    etymology: "real-world species; attested ecology/encounters/oravan.md (oravan.saltwater_crocodile)."
    illustration_ref: null

  - id: ecology.fauna.oravan.reef_grouper
    civ: oravan
    kind: fauna
    placement: open_water
    prose_label: "Kaheri, the reef-king"
    gloss: "Epinephelus spp. — reef grouper, the archipelago's primary reef protein (canon name Kaheri)."
    etymology: "real-world species; attested ecology/regions/oravan.md fauna table (Kaheri)."
    illustration_ref: null

  - id: ecology.fauna.aethelian.bluefin_tuna
    civ: aethelian
    kind: fauna
    placement: open_water
    prose_label: "Aetharion, the great tuna"
    gloss: "Thunnus thynnus — Atlantic bluefin tuna of the basin strait-runs (canon name Aetharion)."
    etymology: "real-world species; attested ecology/regions/aethelian.md (Aetharion), encounters aethelian.mattanza_tuna_haul."
    illustration_ref: null

  - id: ecology.fauna.aethelian.bottlenose_dolphin
    civ: aethelian
    kind: fauna
    placement: open_water
    prose_label: "dolphins at the bow"
    gloss: "Tursiops truncatus — bottlenose dolphins that ride the bow-wave of basin shipping."
    etymology: "real-world species; attested ecology/encounters/aethelian.md (aethelian.dolphins_bow_wave)."
    illustration_ref: null

  - id: ecology.fauna.aethelian.monk_seal
    civ: aethelian
    kind: fauna
    placement: open_water
    prose_label: "Halistra, the cave-seal"
    gloss: "Monachus monachus — Mediterranean monk seal of the basin's coastal caves (canon name Halistra)."
    etymology: "real-world species; attested ecology/regions/aethelian.md (Halistra), encounters aethelian.monk_seal_stack."
    illustration_ref: null

  - id: ecology.fauna.aethelian.loggerhead_turtle
    civ: aethelian
    kind: fauna
    placement: open_water
    prose_label: "the wandering turtle"
    gloss: "Caretta caretta — loggerhead sea turtle nesting on the basin's beaches."
    etymology: "real-world species; attested ecology/regions/aethelian.md fauna table."
    illustration_ref: null

  # ── Beat 4: iconic ocean megafauna (ADR-0023, ratified 2026-06-07 / worldbuilder #65) ──
  # The deep-water leviathans — sighted, never hunted. All five are real species, attested
  # in worldbuilder ecology/regions + ecology/encounters and vetted in _species-allowlist.json;
  # the coined names are minted in the nakhoda (Oravan) and Basin (Aethelian) registers. The
  # picture remains non-canon art (Q2); these rows assert NO new fact, only that cartography
  # may draw the canon's leviathans. The chart engraving pairs with each one's at-sea sighting
  # encounter (synced into encounters.json).

  - id: ecology.fauna.oravan.sperm_whale
    civ: oravan
    kind: fauna
    placement: open_water
    prose_label: "Mohala, the deep-diver"
    gloss: "Physeter macrocephalus — sperm whale of the deep straits, the archipelago's greatest leviathan (canon name Mohala; mo 'deep' + hala 'sea')."
    etymology: "real-world species; attested ecology/regions/oravan.md (Mohala), _species-allowlist.json, encounters oravan.sperm_whale_deep_strait."
    illustration_ref: null

  - id: ecology.fauna.oravan.whale_shark
    civ: oravan
    kind: fauna
    placement: open_water
    prose_label: "Nalara, the star-spotted"
    gloss: "Rhincodon typus — whale shark, largest fish, a harmless plankton-feeder over the reef channels (canon name Nalara; nala 'calm' + lara 'reef')."
    etymology: "real-world species; attested ecology/regions/oravan.md (Nalara), _species-allowlist.json, encounters oravan.whale_shark_baitfish."
    illustration_ref: null

  - id: ecology.fauna.oravan.giant_manta
    civ: oravan
    kind: fauna
    placement: open_water
    prose_label: "Velara, the cloak-shadow"
    gloss: "Mobula birostris — giant manta that glides the reef passes like a thrown cloak (canon name Velara; vele 'unseen, spirit' + lara 'reef')."
    etymology: "real-world species; attested ecology/regions/oravan.md (Velara), _species-allowlist.json, encounters oravan.giant_manta_reef_pass."
    illustration_ref: null

  - id: ecology.fauna.aethelian.great_white
    civ: aethelian
    kind: fauna
    placement: open_water
    prose_label: "Kharistra, the grey weight"
    gloss: "Carcharodon carcharias — great white shark, apex pelagic predator that shadows the tuna traps (canon name Kharistra; khar- 'jagged-toothed' + -stra agentive)."
    etymology: "real-world species; attested ecology/regions/aethelian.md (Kharistra), _species-allowlist.json, encounters aethelian.great_white_rudder."
    illustration_ref: null

  - id: ecology.fauna.aethelian.fin_whale
    civ: aethelian
    kind: fauna
    placement: open_water
    prose_label: "Ketarion, the far spout"
    gloss: "Balaenoptera physalus — fin whale, the largest animal of the basin, sighted on open crossings (canon name Ketarion; Greek ketos 'sea-beast' + -arion, as in Aetharion)."
    etymology: "real-world species; attested ecology/regions/aethelian.md (Ketarion), _species-allowlist.json, encounters aethelian.fin_whale_open_crossing."
    illustration_ref: null
