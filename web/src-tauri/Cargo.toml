[package]
name = "veydria-cartography"
version = "0.1.0"
description = "Veydria Cartography — interactive fantasy-map session-prep tool (Tauri v2 desktop shell)"
authors = ["Veydria"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows; see
# https://github.com/rust-lang/cargo/issues/8519).
name = "veydria_cartography_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
